name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The contract crosses repos: the catalog can break it with a push that this
  # repo never sees. A daily run against the catalog's main catches that.
  schedule:
    - cron: "17 6 * * *"

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floors: node 24 is the oldest that ships npm 11, which
          # `npx github:` needs (npm 10 fails inside npm); Python 3.9 is what
          # update.py and install.py promise. Pinned, so the floor stays
          # tested when lts/* moves on — testing only the LTS is how
          # `node --test test/` once shipped broken.
          - os: ubuntu-latest
            python: "3.9"
            node: "24"
          # The current LTS, on macOS with the runner's own python3
          # (Homebrew's, not Apple's stub).
          - os: macos-latest
            python: ""
            node: lts/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - if: matrix.python != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The fast tests use a fake catalog; the end-to-end one clones the real
      # catalog from GitHub into a throwaway HOME.
      - name: Tests
        run: npm test
        env:
          LOCAL_HERO_E2E: "1"

      # The command users actually type, against this commit: npx resolving a
      # GitHub spec is the part no unit test can stand in for. Not on pull
      # requests, whose commit may live in a fork.
      - name: npx github:… (this commit)
        if: github.event_name != 'pull_request'
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/data"
          mkdir -p "$HOME"
          echo "node $(node --version), npm $(npm --version)"
          npx --yes "github:${{ github.repository }}#${{ github.sha }}" \
            bootstrap --all --tool claude --on-conflict overwrite
          npx --yes "github:${{ github.repository }}#${{ github.sha }}" check
          npx --yes "github:${{ github.repository }}#${{ github.sha }}" update
